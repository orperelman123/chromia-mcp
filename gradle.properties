# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=false

# Project version is Gradle `project.version` (not hardcoded in App.kt).
# This is this fork's release version (github.com/orperelman123/chromia-mcp
# tags v0.3.0, v0.4.0, ...) and the fallback for local builds. CI overrides
# with -Pversion="$(git describe --tags --always)" and the release workflow
# with -Pversion="${TAG#v}" — keep this matching the next planned tag.
version=0.5.0

# Explicit compiler/daemon heaps (see main): two overlapping builds OOMed the
# Kotlin compiler on the default heap once the test set passed 1000 tests.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx2g
