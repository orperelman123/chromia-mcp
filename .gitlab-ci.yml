deploy-image:
  stage: release
  before_script:
    - apk add --no-cache openjdk21 wget unzip
    - export GRADLE_USER_HOME
    - wget -nv "https://github.com/GoogleContainerTools/jib/releases/download/v0.13.0-cli/jib-jre-0.13.0.zip"
    - unzip jib-jre-0.13.0.zip
    - rm jib-jre-0.13.0.zip
  script:
    - ./gradlew jib shadowJar
    - cd claude-code-chromia && ./fetch-deps.sh && cd ..
    - ./jib-0.13.0/bin/jib build --build-file claude-code-chromia/jib.yaml --target ${CI_REGISTRY_IMAGE}/claude-code-chromia --additional-tags=$CI_COMMIT_TAG --username ${CI_REGISTRY_USER} --password ${CI_REGISTRY_PASSWORD}
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/

release-patch:
  extends: .release
  stage: release
  script:
    - |
      NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
      echo "Current version is $CURRENT_VERSION"
      echo "Will create new version $NEXT_VERSION"

      echo "Checking if version $NEXT_VERSION is documented in changelog..."
      git tag $MAJOR.$MINOR.$((PATCH + 1))
      git push --tags
  only:
    - dev
    - /^support\/.*$/

release-minor:
  extends: .release
  stage: release
  script:
    - |
      NEXT_VERSION="$MAJOR.$((MINOR + 1)).0"
      echo "Current version is $CURRENT_VERSION"
      echo "Will create new version $NEXT_VERSION"
      git tag $MAJOR.$((MINOR + 1)).0
      git push --tags
  only:
    - dev
    - /^support\/.*$/
