image: node:18-alpine

stages:
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

build:
  stage: build
  before_script:
    - apk add --no-cache openjdk21
    - export GRADLE_USER_HOME
  script:
    - ./gradlew check --info
    - npm install -g jdeploy
    - npm run build
    - jdeploy install
  artifacts:
    paths:
      - "jdeploy-bundle/"
      - "app/build/libs/"
    expire_in: 1 week
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
      - "**/build"
      - ".gradle"

deploy-npm:
  stage: deploy
  before_script:
    - apk add --no-cache openjdk21
    - npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
    - npm install -g jdeploy
    - export GRADLE_USER_HOME
  script:
    - npm run build
    - npm run jdeploy
    - npm publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  dependencies:
    - build
