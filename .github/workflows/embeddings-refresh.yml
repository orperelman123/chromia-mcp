name: Embeddings refresh

# Regenerates the RAG embeddings from the live docs sources weekly so
# doc-search answers do not go stale. Uploads to the GitLab package registry
# when a GITLAB_ACCESS_TOKEN secret is configured; otherwise attaches
# embeddings.json as a run artifact.

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate embeddings (with registry upload when token present)
        env:
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        run: |
          if [ -n "$GITLAB_ACCESS_TOKEN" ]; then
            ./gradlew :app:generateEmbeddings --console=plain
          else
            ./gradlew :app:generateEmbeddingsNoUpload --console=plain
          fi

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v4
        with:
          name: embeddings
          path: app/build/embeddings.json
          if-no-files-found: error
