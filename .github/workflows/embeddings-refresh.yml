name: Embeddings refresh

# Regenerates the RAG embeddings from the live docs sources and publishes them
# as the `embeddings.json` asset of the rolling `embeddings` release - the URL
# RagStore.GITHUB_RELEASE_URL and the Dockerfile bake step download from.
#
# Why a release asset and not the GitLab package: the package registry belongs
# to ChromaWay's project and its last upload was 2025-10-21; nobody outside can
# refresh it. The asset is rebuilt here with the repository's own GITHUB_TOKEN.
#
# Nothing is published unless the store passes scripts/rag-eval.mjs (probe
# questions answered, segment floor) and no configured source offers materially
# fewer segments than the published index did (a half-failed ingest must not
# overwrite a good index) - scripts/embeddings-gate.mjs, against the per-source
# breakdown the generator writes beside the store.

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the embeddings release when the gate passes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: embeddings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v5, not v4: run 34103273206 (2026-09-07) warned `Node.js 20 is
      # deprecated ... gradle/actions/setup-gradle@v4 ... forced to run on
      # Node.js 24`. Not v6, for the licensing reason ci.yml records.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # v7, matching the other three workflows.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate embeddings and build the server jar
        run: ./gradlew :app:generateEmbeddingsNoUpload :app:shadowJar --console=plain

      - name: Gate - probe questions and segment floor
        run: |
          set -o pipefail
          node scripts/rag-eval.mjs --jar app/build/libs/chromia-mcp-server.jar --embeddings app/build/embeddings.json | tee rag-eval.txt

      # The published index's own account of itself. Missing only before the
      # first sidecar was ever published, which is why this step may find
      # nothing and must not red the run for it - the gate below says so in the
      # summary and passes, because a first publish has nothing to shrink from.
      - name: Download the published provenance sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download embeddings -p embeddings.provenance.json -D published --clobber; then
            echo "PUBLISHED_SIDECAR=published/embeddings.provenance.json" >> "$GITHUB_ENV"
            cat published/embeddings.provenance.json
          else
            echo "no published provenance sidecar - treating this as a first publish"
          fi

      # RED HERE: a docs source really shrank. One of the configured
      # repositories, or the sitemap, offers materially fewer segments than the
      # published index offered - a clone that half-arrived, a sitemap that
      # 404s, a rate limit - so publishing would REPLACE a good index with a
      # worse one, and every fresh `npx chromia-mcp` install downloads that
      # asset. The failing source is named in the job summary with its numbers.
      #
      # THIS STEP USED TO COMPARE BYTES, and that is why it was red from
      # 2026-09-07 (run 34103273206) through 2026-09-09 (run 34344751517) on two
      # healthy ingests: 109,958,949 bytes against 147,681,194, 74.5% of a floor
      # of 80%. Nothing had failed to clone. Commit f0ee597 (audit F15) had
      # taken the host-language TEST sources out of the corpus - 540 documents,
      # 6,481 segments - because `*Test.kt` files were outranking the `.md`
      # pages on ten basic Rell questions, and a byte count cannot tell a
      # deliberate exclusion from a failed fetch. Five days of staleness later,
      # the gate compares SEGMENTS OFFERED (indexed + deliberately excluded),
      # per source, which is the quantity that survives an ingest-rule change:
      # 19,107 + 6,481 = 25,588 against the published 25,588. The byte figures
      # stay in the summary as information, not as the verdict.
      - name: Gate - no source shrank against the published index
        run: |
          published=""
          if [ -n "${PUBLISHED_SIDECAR:-}" ]; then published="--published $PUBLISHED_SIDECAR"; fi
          # word splitting is wanted here: the flag must vanish entirely when there is no sidecar
          # shellcheck disable=SC2086
          node scripts/embeddings-gate.mjs --new app/build/embeddings.provenance.json $published

      # The generator writes the ingest half of the sidecar - per source, with
      # the exclusions counted - while it still has the fetched tree in front of
      # it. Only the RUN knows the other three fields, so they are merged in
      # here. `segments` used to be grepped out of rag-eval.txt: the published
      # number came from a regex over a human-readable line rather than from the
      # thing that built the store.
      - name: Complete the provenance sidecar
        run: |
          # `|| true`: the default shell is `bash -e -o pipefail`, and `head -n1`
          # closing the pipe can leave grep with SIGPIPE on a line that is there.
          # A missing probe count must degrade to `?` in the sidecar, never red a
          # run whose store already passed both gates.
          probes=$(grep -o '[0-9]*/[0-9]* probes answered' rag-eval.txt | head -n1 | cut -d' ' -f1 || true)
          jq --arg commit "$GITHUB_SHA" \
             --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             --arg probes "${probes:-?}" \
             '. + {commit: $commit, run: $run, probes: $probes}' \
             app/build/embeddings.provenance.json > app/build/embeddings.provenance.merged.json
          mv app/build/embeddings.provenance.merged.json app/build/embeddings.provenance.json
          cat app/build/embeddings.provenance.json

      - name: Publish to the rolling embeddings release
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view embeddings >/dev/null 2>&1; then
            gh release create embeddings --prerelease --title "RAG embeddings (rolling)" \
              --notes "Rolling documentation index for the Chromia MCP server. embeddings.json is replaced in place by the Embeddings refresh workflow; embeddings.provenance.json says when and from what."
          fi
          gh release upload embeddings app/build/embeddings.json app/build/embeddings.provenance.json --clobber
          gh release edit embeddings --notes "Rolling documentation index for the Chromia MCP server, replaced in place by the Embeddings refresh workflow. Last refresh: $(date -u +%Y-%m-%d) from $GITHUB_SHA ($(cat app/build/embeddings.provenance.json))."

      # A convenience copy for inspecting a run; the release asset above is the
      # deliverable. First run (2026-09-04) hit the account's artifact storage
      # quota here AFTER a successful publish - this step must never red the run.
      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: embeddings
          path: |
            app/build/embeddings.json
            app/build/embeddings.provenance.json
            rag-eval.txt
          if-no-files-found: error
          retention-days: 7
