name: Release

# Builds the fat jar and attaches it to a GitHub Release.
# Trigger by pushing a tag like v0.3.0, or manually with a tag input.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :app:test :app:shadowJar --console=plain

      - name: Create release with jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "chromia-mcp $TAG" \
            --generate-notes \
            app/build/libs/chromia-mcp-server.jar || \
          gh release upload "$TAG" app/build/libs/chromia-mcp-server.jar --clobber
