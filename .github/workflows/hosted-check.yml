name: Hosted check

# Is https://chromia-mcp.onrender.com running main, and answering from the
# published documentation index? CI proves the commit on GitHub's runner; nothing
# in it can see the hosted box. On 2026-09-05 the hosted service turned out to
# be on a 2026-09-03 commit, 47 behind main, after six rounds had each ended
# with "pushed" - every one of them green in CI.
#
# Runs scripts/hosted-check.mjs: /health version must be main's HEAD (skipped
# when HEAD is younger than 90 min, a Render build is ~30 min), and fetch_docs
# must report a fresh index from the GitHub release asset. A failure opens one
# issue (updated, not duplicated, while it lasts).

on:
  schedule:
    - cron: '30 */6 * * *' # every 6 h
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check the hosted server
        id: check
        run: |
          set +e
          head_age_min=$(( ( $(date +%s) - $(git log -1 --format=%ct HEAD) ) / 60 ))
          if [ "$head_age_min" -lt 90 ]; then
            echo "HEAD is ${head_age_min} min old - a Render build may still be running; version drift is not judged this run"
            node scripts/hosted-check.mjs | tee hosted-check.txt
          else
            node scripts/hosted-check.mjs --expect-commit "$GITHUB_SHA" | tee hosted-check.txt
          fi
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Open or update the drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hosted server is behind main or answering from a stale index"
          body="$(printf '%s\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\nWhat to do: Render dashboard -> chromia-mcp -> Events (auto-deploy off? build failed? GitHub disconnected?) -> Manual Deploy -> Deploy latest commit. Then re-run this workflow.' \
            "scripts/hosted-check.mjs failed against https://chromia-mcp.onrender.com on $(date -u +%Y-%m-%dT%H:%MZ)." \
            "$(cat hosted-check.txt)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug || gh issue create --title "$title" --body "$body"
          fi

      - name: Close the drift issue when the hosted server is current again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hosted server is behind main or answering from a stale index"
          for n in $(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Hosted check passed on $(date -u +%Y-%m-%dT%H:%MZ): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
