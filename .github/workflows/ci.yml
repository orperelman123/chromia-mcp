name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The unit suite had no database, so every DB-backed test SKIPPED here - 8 of
    # them - and a skip is a test that silently did not run. Postchain's collation
    # check needs C-style ordering AND Unicode case mapping at once, which only
    # glibc's C.UTF-8 provides, hence POSTGRES_INITDB_ARGS (same service the e2e
    # job already uses).
    # Unit suite (~8-10 min) plus the e2e budget that used to be its own job:
    # two full sweep attempts, server startups and the 30s inter-attempt pause.
    # A healthy attempt is ~8-12 min and run 33601190754 measured ~16 for one
    # DURING an upstream outage, so the sweep half keeps its 35.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postchain
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v5, not v6: v5 moves the action to the Node 24 runtime (clearing the
      # Node-20 deprecation warning) with no input changes. v6's release notes
      # make upgrading constitute acceptance of Terms of Use for its now-
      # proprietary caching component - a licensing decision for the repo
      # owner, not a CI chore.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Two tests exercise the real chr CLI (the ChrLocator launch path and a
      # live `chr version` probe) and SKIPPED here because the runner had no
      # chr - the zero-skip guard surfaced that. Official Linux install per
      # docs.chromia.com linux.mdx (apt.chromia.com, amd64).
      - name: Install Chromia CLI
        run: |
          curl -fsSL https://apt.chromia.com/chromia.gpg | sudo tee /usr/share/keyrings/chromia.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/chromia.gpg] https://apt.chromia.com stable main" | sudo tee /etc/apt/sources.list.d/chromia.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq chr
          chr --version

      - name: Test and build fat jar
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
          # Three of the four live provisioning tests need only network: they
          # generate a throwaway keypair and assert the account is UNREGISTERED
          # (dry runs, nothing signed, nothing spent). They were skipping here
          # purely because the flag was unset. The fourth needs a real chr
          # keystore and stays out - see the allowlist below.
          CHROMIA_LIVE_PROVISIONING_TESTS: "true"
        run: ./gradlew :app:test :app:shadowJar --console=plain -Pversion="$(git describe --tags --always)"

      # A skip is a test that silently did not run. Gradle prints the skip count
      # only when something FAILS, so a green run with 8 skips looked identical
      # to a green run with none - that is exactly how this job quietly covered
      # less than it claimed until 2026-09-02. Count them from the XML and red
      # the build on any, so coverage cannot drift back without CI noticing.
      - name: Fail on any skipped test
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ALLOWED = {
              # The ONLY tolerated skip: it asserts that the zero-human default
              # path resolves a funding key from the machine's own chr keystore
              # (~/.chromia) and finds its FT4 account registered on the live
              # Economy Chain. A runner has no keystore, so there is nothing for
              # it to assert. Removing this last skip needs a registered testnet
              # key as a repository secret - the owner's call, never committed.
              'org.chromia.TestnetProvisioningLiveTest::liveDefaultChrKeystorePathResolvesARegisteredAccount(Path)',
          }
          t = f = s = 0; skipped = []; unexpected = []
          for p in glob.glob('app/build/test-results/test/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  if tc.find('skipped') is not None:
                      key = f"{r.get('name')}::{tc.get('name')}"
                      line = f"{key}: {(tc.find('skipped').get('message') or '').strip()[:160]}"
                      skipped.append(line)
                      if key not in ALLOWED: unexpected.append(line)
          print(f"tests={t} failures={f} skipped={s} (allowed-by-name={len(skipped) - len(unexpected)})")
          for x in skipped: print("  skip:", x)
          if t == 0:
              print("no test results found - the suite did not run"); sys.exit(1)
          if unexpected:
              print("UNEXPECTED SKIPS (a skip is a test that did not run):"); print("\n".join("  " + x for x in unexpected)); sys.exit(1)
          PY

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test
          # Long enough to read after a red run, short enough not to accumulate.
          retention-days: 7

      # THE JAR IS NOT AN ARTIFACT ANY MORE, and the e2e steps now run in this
      # same job. It only ever existed to hand a 266 MB file from this job to a
      # job that `needs:` it - so they never ran in parallel and nothing else
      # consumed it (release.yml and nightly-fuzz.yml each build their own).
      # Kept for the default 90 days it put 54 copies and 14.4 GB into the
      # account's artifact quota in four days, and CI then went red on the
      # UPLOAD step with a green 1175-test suite behind it - twice, runs
      # 33729077322 and 33730306288. A red that everyone learns to read as
      # "probably just the quota" is worse than no signal at all, which is the
      # same argument GOAL.md makes about a gate agents route around. Merging
      # the jobs removes the upload, the download and the storage outright.

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Failure policy (what CI treats as fatal vs degraded):
      # - The unit suite above is STRICT: no retries, any failure is fatal.
      # - This e2e step exercises live third parties (explorer, mainnet/testnet
      #   nodes, docs site). The sweep itself classifies clean upstream errors
      #   as WARN-UPSTREAM (degraded, non-fatal) with guardrails so it cannot
      #   hide real breakage - see scripts/upstream-classifier.mjs. A FAIL from
      #   the sweep/agent therefore means OUR contract broke, EXCEPT a single
      #   transient blip (e.g. a dropped connection mid-run), which the one
      #   bounded retry below absorbs. Each attempt gets a FRESH server on a
      #   freed port (kill + wait), so nothing is double-counted or leaked;
      #   two consecutive failures are fatal - a persistent problem still reds CI.
      # - Exception to the retry: sweep exit 3 means the ONLY failures were the
      #   upstream guardrails (all-live-warn / too-many-warns) - deterministic
      #   for the duration of an outage, so a second 10+ minute attempt cannot
      #   change the verdict. Fail immediately without retrying (still red).
      - name: Start server (full toolset) and run the end-to-end sweep
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
        run: |
          run_e2e() {
            java -XX:MaxRAMPercentage=60 -jar app/build/libs/chromia-mcp-server.jar --sse --host 127.0.0.1 --port 3001 &
            local server_pid=$!
            local rc=0
            for i in $(seq 1 90); do
              curl -sf http://127.0.0.1:3001/health >/dev/null && break
              sleep 2
            done
            curl -sf http://127.0.0.1:3001/health || rc=$?
            if [ "$rc" -eq 0 ]; then node scripts/e2e-sweep.mjs http://127.0.0.1:3001 || rc=$?; fi
            if [ "$rc" -eq 0 ]; then node scripts/synthetic-agent.mjs http://127.0.0.1:3001 || rc=$?; fi
            # Always reap the server so a retry starts clean on a freed port.
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            return "$rc"
          }
          rc=0
          run_e2e || rc=$?
          # Exit 3 can only come from the sweep's guardrail-only path (curl
          # would need a malformed literal URL, node/synthetic-agent exit 0/1).
          if [ "$rc" -eq 3 ]; then
            echo "::error::e2e failed on the sweep's upstream guardrails only (exit 3) - deterministic while the upstream outage lasts, so a retry cannot change the verdict"
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::e2e attempt 1 failed - retrying once with a fresh server (a single transient blip must not red-line CI; a persistent failure still will)"
            sleep 30
            run_e2e
          fi

      - name: Stdio transport smoke (the Claude Code surface + npm launcher)
        env:
          CHROMIA_MCP_JAR: app/build/libs/chromia-mcp-server.jar
        run: |
          node scripts/stdio-smoke.mjs app/build/libs/chromia-mcp-server.jar
          node scripts/stdio-smoke.mjs --launcher
