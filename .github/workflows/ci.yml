name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build fat jar
        run: ./gradlew :app:test :app:shadowJar --console=plain -Pversion="$(git describe --tags --always)"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test

      - name: Upload server jar
        uses: actions/upload-artifact@v7
        with:
          name: chromia-mcp-server
          path: app/build/libs/chromia-mcp-server.jar
          if-no-files-found: error

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postchain
          # postchain's collation check requires C.UTF-8
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Download server jar
        uses: actions/download-artifact@v8
        with:
          name: chromia-mcp-server

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Start server (full toolset) and run the end-to-end sweep
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
        run: |
          java -XX:MaxRAMPercentage=60 -jar chromia-mcp-server.jar --sse --host 127.0.0.1 --port 3001 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3001/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/health
          node scripts/e2e-sweep.mjs http://127.0.0.1:3001
          node scripts/synthetic-agent.mjs http://127.0.0.1:3001
          kill $SERVER_PID || true

      - name: Stdio transport smoke (the Claude Code surface + npm launcher)
        env:
          CHROMIA_MCP_JAR: chromia-mcp-server.jar
        run: |
          node scripts/stdio-smoke.mjs chromia-mcp-server.jar
          node scripts/stdio-smoke.mjs --launcher
