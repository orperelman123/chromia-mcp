name: CI

# THE MERGE GATE, as GitHub runs it. `docs/CI.md` is the operator's manual for
# this file: what every step proves, what a red in it means, and what to do
# next. Every claim docs/CI.md makes about this workflow is pinned by
# CiWorkflowDocumentationTest, so the two cannot drift apart silently.
#
# The rule this workflow exists to keep: THE LOCAL GATE AND THIS GATE MUST BE
# THE SAME GATE. `scripts/gate-tally.mjs` is the single classifier; the local
# `scripts/loop-gate.mjs` imports it and the `Classify the tally` step below
# runs it. Two gates with different definitions of green is one gate and one
# bypass, which is exactly what the removed `--allow-skip` flag was.

on:
  push:
    branches: [main]
  # PRs INTO MAIN, gated identically. A branch is merged by the orchestrator
  # after `scripts/loop-gate.mjs` passes in its worktree; this is the same
  # verdict computed on a clean Linux checkout, which is the half a Windows
  # laptop cannot prove (see .gitattributes - CRLF drift cost round 17 a cycle).
  # Scoped with `branches:` so a PR between two side branches does not spend the
  # budget on a tree nobody is about to merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. Nothing in this workflow writes to the repository: it reads
# the checkout, runs tests and uploads artifacts (which need no `contents`
# permission at all). release.yml and embeddings-refresh.yml ask for
# `contents: write` because they publish; this one has nothing to publish.
permissions:
  contents: read

# A SUPERSEDED PUSH IS CANCELLED. This job is a 16-44 minute occupation of a
# runner (measured across the last twelve CI runs, below), and two pushes a
# minute apart used to run it twice to completion for a tree that only existed
# for sixty seconds.
#
# Grouped by REF, so main and each pull request queue independently and a PR run
# never cancels main's. Nothing untested can land this way: cancelling the run
# for commit A when commit B arrives on the same ref is safe precisely because
# B's tree CONTAINS A, so the newer run gates strictly more. What IS lost is A's
# own per-commit verdict, which matters when bisecting - re-run it from the
# Actions tab, which is what `workflow_dispatch` above is for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The unit suite had no database, so every DB-backed test SKIPPED here - 8 of
    # them - and a skip is a test that silently did not run. Postchain's collation
    # check needs C-style ordering AND Unicode case mapping at once, which only
    # glibc's C.UTF-8 provides, hence POSTGRES_INITDB_ARGS (same service the
    # nightly fuzz job also uses).
    #
    # TIMEOUTS, DERIVED. Every number here is measured off the last twelve CI
    # runs (34032465035 .. 34274736432, 2026-09-06 to 2026-09-08) via
    # `gh api repos/.../actions/runs/<id>/jobs`, not guessed:
    #
    #   whole job, wall clock         16m08s .. 43m52s
    #   the unit suite step           18m27s and 32m51s, the two runs since
    #                                 rounds 17-19 landed. The ten runs before
    #                                 them measured 5m43s .. 8m02s for the same
    #                                 work under the step's old name, so the
    #                                 suite roughly quadrupled - and it still
    #                                 spread 1.8x between two consecutive runs
    #                                 of the same 1623 tests
    #   the e2e sweep step            8m51s median, 17m32s worst (34053646001,
    #                                 a real failure that also paid for a retry)
    #   everything else               ~1m00s setup + 39s jar + ~35s tail
    #
    # The old `timeout-minutes: 50` was PROVABLY too tight: worst measured unit
    # suite + worst measured e2e + the fixed cost is 52m37s, so a bad-but-healthy
    # run would have been killed with no verdict at all. It came within 6m08s.
    #
    # Per-STEP budgets are what actually diagnose a hang - a job timeout kills
    # the runner without saying which step was in the chair - and the job budget
    # is deliberately set ABOVE their sum so a step timeout always fires first:
    #   45 (unit suite) + 30 (e2e) + 2 (setup) + 1 (jar) + 1 (tail) = 79.
    #
    # This also answers the FLAG left in app/build.gradle.kts, which asks whether
    # ubuntu-latest is materially faster than the 15 W laptop or whether CI was
    # being killed. Measured: the same suite is 58m55s there and 32m51s here, so
    # the runner IS faster and CI was not being killed - but 50 minutes had
    # stopped covering it, which is the half of that flag that was true.
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postchain
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # RED HERE: GitHub could not fetch the repository. Infrastructure, not you.
      - uses: actions/checkout@v7

      # RED HERE: the Temurin 21 download failed, or the toolchain moved. The
      # project targets JDK 21 and nothing below it compiles.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v5, not v6: v5 moves the action to the Node 24 runtime (clearing the
      # Node-20 deprecation warning) with no input changes. v6's release notes
      # make upgrading constitute acceptance of Terms of Use for its now-
      # proprietary caching component - a licensing decision for the repo
      # owner, not a CI chore.
      # RED HERE: the action or the Gradle distribution could not be fetched.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Node runs the tally that decides this job's verdict (the classification
      # step below) as well as the e2e sweep, so it is set up BEFORE the suite
      # rather than after it - a runner's ambient node version is not something
      # the merge decision should depend on.
      # RED HERE: Node 22 could not be installed. Infrastructure.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Two tests exercise the real chr CLI (the ChrLocator launch path and a
      # live `chr version` probe) and SKIPPED here because the runner had no
      # chr - the zero-skip guard surfaced that. Official Linux install per
      # docs.chromia.com linux.mdx (apt.chromia.com, amd64).
      # RED HERE: apt.chromia.com is unreachable, or has dropped the `chr`
      # package for amd64. That is upstream, and it is fatal on purpose: with no
      # chr the two CLI tests SKIP, and a skip is a test that did not run.
      - name: Install Chromia CLI
        run: |
          curl -fsSL https://apt.chromia.com/chromia.gpg | sudo tee /usr/share/keyrings/chromia.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/chromia.gpg] https://apt.chromia.com stable main" | sudo tee /etc/apt/sources.list.d/chromia.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq chr
          chr --version

      # THE SUITE. RED HERE: only ever infrastructure - this step deliberately
      # swallows gradle's exit code (see below), so it can only fail if the shell
      # itself does, or if it exceeds the 45-minute budget. A TIMEOUT here means
      # a hang: read the last `> Task :app:test` lines for the class that was in
      # the chair, and do NOT raise this number before deciding whether it was a
      # hang or a genuinely longer suite. app/build.gradle.kts carries the same
      # warning about the task's own 90-minute timeout, and it is there because
      # raising a timeout hides a hang perfectly.
      #
      # Budget: 45. Worst measured 32m51s (run 34274736432); the step spread
      # 18m27s -> 32m51s between two consecutive runs, so 45 is the worst
      # measured plus that spread again - and still 45 minutes short of the
      # point at which gradle would kill the task itself and say so.
      - name: Run the unit suite
        timeout-minutes: 45
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
          # All four live provisioning tests need only network, never a key:
          # three generate a throwaway keypair and assert the account is
          # UNREGISTERED (dry runs, nothing signed, nothing spent); the fourth
          # reads get_balance for a public, known-registered account id. They
          # were skipping here purely because the flag was unset.
          CHROMIA_LIVE_PROVISIONING_TESTS: "true"
          # The chr CLI is installed above, so the two probes that use it must
          # not be allowed to shrug. With this set, LiveEnv escalates "chr is
          # missing" and "chr is present but would not run" from a SKIP to a
          # FAILURE. The second case is the one that mattered: the box most
          # likely to have an unlaunchable chr (a Windows .cmd shim) was exactly
          # the box that silently opted out of the launch-path coverage.
          CHROMIA_REQUIRE_CHR: "true"
        # Gradle's exit code can no longer be the verdict on its own. A PROVEN
        # upstream outage is a <failure> in the XML like any other - nothing
        # pretends to pass - so `:app:test` exits non-zero for something that is
        # ChromaWay's to fix, not ours. The verdict is the classification step
        # below, which is the SAME script the merge gate imports. The jar is
        # built separately so a red suite still cannot ship one.
        run: |
          rc=0
          ./gradlew :app:test --console=plain -Pversion="$(git describe --tags --always)" || rc=$?
          echo "gradle :app:test exited $rc - the verdict is the tally below (upstream warnings are counted separately)"

      # THE SUMMARY, and it is a PRESENTER, never a gate. It renders the tally
      # the next step is about to compute into `$GITHUB_STEP_SUMMARY` - the
      # ours/upstream/skipped counts, every failing test by name with the reason,
      # and every proven outage with the docs/UPSTREAM.md entry that excuses it -
      # so an operator never has to open a 40-minute log to learn what broke.
      # Before it existed, the one classification failure in the last twelve runs
      # (34272194244) printed its verdict interleaved with another test's
      # evidence, because GitHub merges stdout and stderr by arrival.
      #
      # It imports `tally` from the same gate-tally.mjs rather than
      # re-implementing it - one classifier, always - and it ALWAYS EXITS 0 by
      # construction, because a presenter that could red or green the build would
      # be a second gate with different rules. `if: always()` so the table exists
      # even when the suite step above timed out.
      # RED HERE: cannot happen. The step exits 0 or the runner died.
      - name: Write the job summary
        if: always()
        run: node scripts/ci-summary.mjs --dir "$PWD"

      # THE VERDICT, and the third status. One implementation, shared with
      # scripts/loop-gate.mjs: a failure whose message begins
      # `UPSTREAM WARNING (proven): ` AND which is backed by an evidence file in
      # app/build/upstream/warnings/ carrying an allowlisted signature is counted
      # as upstream=N and printed by name - but only when the three round-19
      # checks hold as well:
      #
      #   - the failure message BINDS that file, `[evidence sha256:<hex>]` over
      #     its bytes. The message comes out of the test process's own throwable
      #     and the evidence file is an ordinary file anyone can write, so the
      #     digest is what says the two belong to each other;
      #   - the proof is an INDEPENDENT canary that failed with the SAME
      #     signature (FAILED_OTHER is "may well be ours" and proves nothing), or
      #     a docs/UPSTREAM.md entry the tally READS OUT OF THE FILE - the entry
      #     must exist, its heading must match, its section must be dated and
      #     must name the query. `--dir "$PWD"` is what says which checkout holds
      #     that ledger;
      #   - the timestamp is inside this run.
      #
      # Everything else - including a message that claims the status with no
      # evidence, and every skip - is red. There is NO allowlist of test names
      # here or anywhere else. docs/UPSTREAM.md, "The upstream-warning
      # contract", is the long form.
      #
      # RED HERE: the suite failed, or did not run at all. THIS IS THE STEP THAT
      # DECIDES THE MERGE. The job summary above already names every failure;
      # docs/CI.md says how to reproduce each kind locally.
      - name: Classify the tally (ours, theirs, and skips)
        run: node scripts/gate-tally.mjs --dir "$PWD"

      # RED HERE: shadowJar failed on a suite that had already passed - which in
      # practice means a duplicate or missing entry in the shadow merge, not a
      # test problem. Nothing below this line can run without the jar.
      - name: Build the fat jar
        run: ./gradlew :app:shadowJar --console=plain -Pversion="$(git describe --tags --always)"

      # A skip is a test that silently did not run. Gradle prints the skip count
      # only when something FAILS, so a green run with 8 skips looked identical
      # to a green run with none - that is exactly how this job quietly covered
      # less than it claimed until 2026-09-02. Count them from the XML and red
      # the build on any, so coverage cannot drift back without CI noticing.
      #
      # This DUPLICATES the skip half of the classification step above, and the
      # duplication is deliberate: the two readers are independent (python's
      # ElementTree here, a regex scan over the same XMLs there), so a bug in
      # either one cannot make a skipped test invisible to both.
      # RED HERE: a test skipped. Provision what it needs. There is no allowlist.
      - name: Fail on any skipped test
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          # NO ALLOWED SKIPS. There used to be exactly one - the live test that
          # asserted a funding key resolves from the machine's own chr keystore AND
          # that its account is registered on the Economy Chain, which no runner can
          # do. Its three assertions are covered without a key now: resolution by
          # FundingKeyResolutionTest (temp-dir keystores, no network), the
          # no-private-key-leak property by the throwaway-keypair dry run, and the
          # positive registration lookup by liveKnownAccountIsRegisteredOnTheEconomyChain,
          # which reads get_balance for a public account id. A skip is a test that did
          # not run, and this job now tolerates none.
          ALLOWED = set()
          t = f = s = 0; skipped = []; unexpected = []
          for p in glob.glob('app/build/test-results/test/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  if tc.find('skipped') is not None:
                      key = f"{r.get('name')}::{tc.get('name')}"
                      line = f"{key}: {(tc.find('skipped').get('message') or '').strip()[:160]}"
                      skipped.append(line)
                      if key not in ALLOWED: unexpected.append(line)
          print(f"tests={t} failures={f} skipped={s} (allowed-by-name={len(skipped) - len(unexpected)})")
          for x in skipped: print("  skip:", x)
          if t == 0:
              print("no test results found - the suite did not run"); sys.exit(1)
          if unexpected:
              print("UNEXPECTED SKIPS (a skip is a test that did not run):"); print("\n".join("  " + x for x in unexpected)); sys.exit(1)
          PY

      # THE TEST REPORT, ON EVERY RUN. It used to be `if: failure()`, which is
      # backwards for two of the three things it is actually read for: comparing
      # a slow run against the previous GREEN one (the round-19 task-timeout
      # decision was made off exactly that comparison), and confirming what a
      # green run covered. `always()` also catches the case the old condition
      # missed entirely - a job cancelled by `concurrency` or killed by a timeout
      # is neither success nor failure, and used to leave nothing behind at all.
      #
      # Cost: this is the small HTML report, not the 266 MB fat jar whose 90-day
      # uploads once put 14.4 GB into the account's artifact quota in four days
      # (see the note further down; that artifact is gone). 7 days is long enough
      # to read after a red run and short enough not to accumulate.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test
          # A run that died before the suite produced a report must not turn this
          # step red on top of whatever actually broke.
          if-no-files-found: warn
          retention-days: 7

      # THE UPSTREAM EVIDENCE, ON EVERY RUN. One JSON per proven third-party
      # outage, written by LiveEnv during the suite: the signature, the third
      # party's own words, the canary measurement, the ledger entry, and the
      # sha256 the failing test bound into its own assertion message. It is the
      # only durable record that an `upstream=1` verdict was earned rather than
      # asserted, and the job summary cites these paths by name - so they have to
      # survive the run, green or red. Retained longer than the test report
      # because an outage argument is made across days ("#3b has been failing all
      # week"), not minutes.
      - name: Upload upstream evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-evidence
          path: app/build/upstream
          # The normal case is that there is none, and that is not a failure.
          if-no-files-found: ignore
          retention-days: 30

      # THE JAR IS NOT AN ARTIFACT ANY MORE, and the e2e steps now run in this
      # same job. It only ever existed to hand a 266 MB file from this job to a
      # job that `needs:` it - so they never ran in parallel and nothing else
      # consumed it (release.yml and nightly-fuzz.yml each build their own).
      # Kept for the default 90 days it put 54 copies and 14.4 GB into the
      # account's artifact quota in four days, and CI then went red on the
      # UPLOAD step with a green 1175-test suite behind it - twice, runs
      # 33729077322 and 33730306288. A red that everyone learns to read as
      # "probably just the quota" is worse than no signal at all, which is the
      # same argument GOAL.md makes about a gate agents route around. Merging
      # the jobs removes the upload, the download and the storage outright.

      # Failure policy (what CI treats as fatal vs degraded):
      # - The unit suite above is STRICT: no retries, any failure is fatal.
      # - This e2e step exercises live third parties (explorer, mainnet/testnet
      #   nodes, docs site). The sweep itself classifies clean upstream errors
      #   as WARN-UPSTREAM (degraded, non-fatal) with guardrails so it cannot
      #   hide real breakage - see scripts/upstream-classifier.mjs. A FAIL from
      #   the sweep/agent therefore means OUR contract broke, EXCEPT a single
      #   transient blip (e.g. a dropped connection mid-run), which the one
      #   bounded retry below absorbs. Each attempt gets a FRESH server on a
      #   freed port (kill + wait), so nothing is double-counted or leaked;
      #   two consecutive failures are fatal - a persistent problem still reds CI.
      # - Exception to the retry: sweep exit 3 means the ONLY failures were the
      #   upstream guardrails (all-live-warn / too-many-warns) - deterministic
      #   for the duration of an outage, so a second 10+ minute attempt cannot
      #   change the verdict. Fail immediately without retrying (still red).
      #
      # RED HERE: read the `FAIL <check>` lines, not the `WARN-UPSTREAM` ones. If
      # both attempts fail the SAME check it is ours and it reproduces locally
      # (docs/CI.md has the two commands). If they fail different checks, suspect
      # the network before the code.
      #
      # MEASURED LIMIT, recorded rather than fixed: the retry re-runs the WHOLE
      # e2e - both transports and the synthetic agent - when any one of them
      # failed. Run 34053646001 spent 17m32s failing `agent: preflight blocks the
      # placeholder container` twice for a deterministic defect, and the second
      # 8m41s bought nothing. Making the retry per-check needs the sweep to say
      # which check failed in a machine-readable way, which it does not do today;
      # until then the cost is ~9 minutes, and only on a genuinely broken push.
      #
      # Budget: 30. Worst measured 17m32s (34053646001, both attempts), median
      # 8m51s over twelve runs. Two attempts of the worst SINGLE pass (~9m) plus
      # the 30s pause is ~19m, so 30 covers a bad-network double run with room -
      # and a hang is then named as this step's rather than the whole job's.
      - name: Start server (full toolset) and run the end-to-end sweep
        timeout-minutes: 30
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
        run: |
          run_e2e() {
            java -XX:MaxRAMPercentage=60 -jar app/build/libs/chromia-mcp-server.jar --sse --host 127.0.0.1 --port 3001 &
            local server_pid=$!
            local rc=0
            for i in $(seq 1 90); do
              curl -sf http://127.0.0.1:3001/health >/dev/null && break
              sleep 2
            done
            curl -sf http://127.0.0.1:3001/health || rc=$?
            # The SAME sweep over BOTH HTTP transports of the SAME server. They
            # must serve an identical tool surface; running one and assuming the
            # other is how a client that picked the newer endpoint would have
            # discovered a difference in production instead of here.
            if [ "$rc" -eq 0 ]; then node scripts/e2e-sweep.mjs http://127.0.0.1:3001 --transport sse || rc=$?; fi
            if [ "$rc" -eq 0 ]; then node scripts/e2e-sweep.mjs http://127.0.0.1:3001 --transport http || rc=$?; fi
            if [ "$rc" -eq 0 ]; then node scripts/synthetic-agent.mjs http://127.0.0.1:3001 || rc=$?; fi
            # Always reap the server so a retry starts clean on a freed port.
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            return "$rc"
          }
          rc=0
          run_e2e || rc=$?
          # Exit 3 can only come from the sweep's guardrail-only path (curl
          # would need a malformed literal URL, node/synthetic-agent exit 0/1).
          if [ "$rc" -eq 3 ]; then
            echo "::error::e2e failed on the sweep's upstream guardrails only (exit 3) - deterministic while the upstream outage lasts, so a retry cannot change the verdict"
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::e2e attempt 1 failed - retrying once with a fresh server (a single transient blip must not red-line CI; a persistent failure still will)"
            sleep 30
            run_e2e
          fi

      # serve-local.ps1 / serve-public.ps1 are the two supported launchers and they
      # are not covered by the Kotlin suite. A parse check is what this runner can
      # honestly do: it catches the class of breakage that actually happens to them
      # (a bad edit that only fails when a user double-clicks the .cmd). The real
      # -NoTunnel run is a Windows step; starting an actual tunnel is never CI's call.
      # RED HERE: one of the two launchers no longer parses. The error names the
      # file and the parser's own message. It is a syntax fix, never a flake.
      - name: PowerShell launchers parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @('serve-local.ps1', 'serve-public.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $failed = $true; Write-Host "::error::$f : $($errors | ForEach-Object { $_.Message })" }
            else { Write-Host "$f parses" }
          }
          if ($failed) { exit 1 }

      # RED HERE: the stdio transport - the surface Claude Code and every other
      # local MCP client actually speaks - stopped answering, or the npm launcher
      # stopped finding the jar it was handed. Neither touches the network, so a
      # red here is ours, always.
      - name: Stdio transport smoke (the Claude Code surface + npm launcher)
        env:
          CHROMIA_MCP_JAR: app/build/libs/chromia-mcp-server.jar
        run: |
          node scripts/stdio-smoke.mjs app/build/libs/chromia-mcp-server.jar
          node scripts/stdio-smoke.mjs --launcher

      # The real first run of `npx chromia-mcp`: empty home, no local jar, so the
      # launcher must download the LAST RELEASE's jar from the public GitHub
      # release and run it. Transport-level checks only - that jar is not this
      # commit. Possible since the repo went public (2026-09-05).
      # RED HERE: a new user's very first `npx chromia-mcp` is broken. Either the
      # launcher's download path regressed (ours), or the latest GitHub release
      # carries no jar asset - check release.yml's last run before blaming this
      # commit.
      - name: npm launcher release download (the end-user install path)
        run: node scripts/stdio-smoke.mjs --launcher-download

      # Boot the jar the way a first `npx chromia-mcp` does - NO local
      # embeddings.json, cache OFF, NO token - and require that the index it
      # answers from is the published GitHub release asset, fresh, and passes the
      # RAG probes. This is the check that was missing on 2026-09-04, twice: a
      # fresh store was published and the then-hosted server silently kept
      # answering from the 2025-10-21 GitLab package (first the loader could not
      # read it under the JVM caps, then the private repo answered 404) while
      # every unit test was green. A red here means a fresh install would be stale.
      # RED HERE: check embeddings-refresh.yml's last run first - a stale or
      # missing `embeddings` release asset reds this step without anything in
      # this commit being wrong.
      - name: Fresh-install boot (no local index, no cache, no token -> published asset)
        run: node scripts/rag-eval.mjs --production-shaped --jar app/build/libs/chromia-mcp-server.jar
