name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The unit suite had no database, so every DB-backed test SKIPPED here - 8 of
    # them - and a skip is a test that silently did not run. Postchain's collation
    # check needs C-style ordering AND Unicode case mapping at once, which only
    # glibc's C.UTF-8 provides, hence POSTGRES_INITDB_ARGS (same service the e2e
    # job already uses).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postchain
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v5, not v6: v5 moves the action to the Node 24 runtime (clearing the
      # Node-20 deprecation warning) with no input changes. v6's release notes
      # make upgrading constitute acceptance of Terms of Use for its now-
      # proprietary caching component - a licensing decision for the repo
      # owner, not a CI chore.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build fat jar
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
        run: ./gradlew :app:test :app:shadowJar --console=plain -Pversion="$(git describe --tags --always)"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test

      - name: Upload server jar
        uses: actions/upload-artifact@v7
        with:
          name: chromia-mcp-server
          path: app/build/libs/chromia-mcp-server.jar
          if-no-files-found: error

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Must fit TWO full sweep attempts plus server startups and the 30s
    # inter-attempt pause: a healthy attempt is ~8-12 min, and run 33601190754
    # measured ~16 min for one attempt DURING an upstream outage (before the
    # dapp_query deadline and the adaptive coverage backoff shrank that case).
    # 2 x 16 + startup/pause + headroom = 35. The old 20 could not even fit
    # two healthy attempts, so the retry it was paired with guaranteed a
    # cancellation instead of a verdict whenever attempt 1 failed slowly.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postchain
          # postchain's collation check requires C.UTF-8
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Download server jar
        uses: actions/download-artifact@v8
        with:
          name: chromia-mcp-server

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Failure policy (what CI treats as fatal vs degraded):
      # - build-and-test (unit tests) is STRICT: no retries, any failure is fatal.
      # - This e2e step exercises live third parties (explorer, mainnet/testnet
      #   nodes, docs site). The sweep itself classifies clean upstream errors
      #   as WARN-UPSTREAM (degraded, non-fatal) with guardrails so it cannot
      #   hide real breakage - see scripts/upstream-classifier.mjs. A FAIL from
      #   the sweep/agent therefore means OUR contract broke, EXCEPT a single
      #   transient blip (e.g. a dropped connection mid-run), which the one
      #   bounded retry below absorbs. Each attempt gets a FRESH server on a
      #   freed port (kill + wait), so nothing is double-counted or leaked;
      #   two consecutive failures are fatal - a persistent problem still reds CI.
      # - Exception to the retry: sweep exit 3 means the ONLY failures were the
      #   upstream guardrails (all-live-warn / too-many-warns) - deterministic
      #   for the duration of an outage, so a second 10+ minute attempt cannot
      #   change the verdict. Fail immediately without retrying (still red).
      - name: Start server (full toolset) and run the end-to-end sweep
        env:
          CHROMIA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postchain
        run: |
          run_e2e() {
            java -XX:MaxRAMPercentage=60 -jar chromia-mcp-server.jar --sse --host 127.0.0.1 --port 3001 &
            local server_pid=$!
            local rc=0
            for i in $(seq 1 90); do
              curl -sf http://127.0.0.1:3001/health >/dev/null && break
              sleep 2
            done
            curl -sf http://127.0.0.1:3001/health || rc=$?
            if [ "$rc" -eq 0 ]; then node scripts/e2e-sweep.mjs http://127.0.0.1:3001 || rc=$?; fi
            if [ "$rc" -eq 0 ]; then node scripts/synthetic-agent.mjs http://127.0.0.1:3001 || rc=$?; fi
            # Always reap the server so a retry starts clean on a freed port.
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            return "$rc"
          }
          rc=0
          run_e2e || rc=$?
          # Exit 3 can only come from the sweep's guardrail-only path (curl
          # would need a malformed literal URL, node/synthetic-agent exit 0/1).
          if [ "$rc" -eq 3 ]; then
            echo "::error::e2e failed on the sweep's upstream guardrails only (exit 3) - deterministic while the upstream outage lasts, so a retry cannot change the verdict"
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::e2e attempt 1 failed - retrying once with a fresh server (a single transient blip must not red-line CI; a persistent failure still will)"
            sleep 30
            run_e2e
          fi

      - name: Stdio transport smoke (the Claude Code surface + npm launcher)
        env:
          CHROMIA_MCP_JAR: chromia-mcp-server.jar
        run: |
          node scripts/stdio-smoke.mjs chromia-mcp-server.jar
          node scripts/stdio-smoke.mjs --launcher
