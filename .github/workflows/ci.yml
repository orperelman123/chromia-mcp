name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build fat jar
        run: ./gradlew :app:test :app:shadowJar --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: chromia-mcp-server
          path: app/build/libs/chromia-mcp-server.jar
          if-no-files-found: error
